<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REPEATER 3D - AI Assistant</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #01090d;
            color: #00f3ff;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            cursor: grab;
        }
        #canvas-container:active {
            cursor: grabbing;
        }
        /* Center Holographic REPEATER Animation (Like the Video) */
        #center-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 7px;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc, 0 0 25px #00f3ff, 0 0 40px #0088ff;
            z-index: 2;
            pointer-events: none;
            animation: holoPulse 2.2s ease-in-out infinite alternate;
        }
        @keyframes holoPulse {
            0% { opacity: 0.45; transform: translate(-50%, -50%) scale(0.92); letter-spacing: 6px; }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); letter-spacing: 9px; }
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 3;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 25px;
            box-sizing: border-box;
            background: radial-gradient(circle, transparent 40%, rgba(0, 12, 18, 0.88) 100%);
        }
        header {
            text-align: center;
            text-shadow: 0 0 12px #00f3ff;
            width: 100%;
            position: relative;
        }
        h1 {
            margin: 0;
            letter-spacing: 8px;
            font-size: 26px;
            color: #00ffcc;
        }
        #status {
            font-size: 13px;
            color: #00f3ff;
            margin-top: 6px;
            letter-spacing: 2px;
        }
        #api-btn {
            position: absolute;
            top: 0;
            right: 10px;
            pointer-events: auto;
            font-size: 12px;
            padding: 8px 14px;
            letter-spacing: 1px;
        }
        #transcript-box {
            max-width: 680px;
            text-align: center;
            font-size: 17px;
            min-height: 45px;
            margin-top: auto;
            margin-bottom: 25px;
            padding: 15px 25px;
            border: 1px solid rgba(0, 255, 204, 0.4);
            background: rgba(0, 22, 32, 0.65);
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            text-shadow: 0 0 5px #00f3ff;
        }
        #controls {
            pointer-events: auto;
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }
        button {
            background: rgba(0, 243, 255, 0.12);
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 12px 28px;
            font-family: inherit;
            font-size: 15px;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.35);
            transition: all 0.25s ease;
            text-transform: uppercase;
        }
        button:hover {
            background: #00ffcc;
            color: #01090d;
            box-shadow: 0 0 25px #00ffcc;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Center Animation Text inside the 3D Orb -->
    <div id="center-logo">REPEATER</div>

    <div id="hud">
        <header>
            <h1>R.E.P.E.A.T.E.R.</h1>
            <div id="status">SYSTEM STANDBY</div>
            <button id="api-btn">🔑 SET AI KEY</button>
        </header>

        <div id="transcript-box">Click ACTIVATE SYSTEM to boot Repeater AI...</div>

        <div id="controls">
            <button id="toggle-btn">ACTIVATE SYSTEM</button>
        </div>
    </div>

    <script>
       // ==========================================
        // 1. NEXT-LEVEL 3D SCI-FI ARC REACTOR CORE
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 6.2;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const coreGroup = new THREE.Group();
        coreGroup.position.y = 0.2;
        scene.add(coreGroup);

        // A. Inner Glowing Plasma Sphere + Dual Cage
        const innerGeo = new THREE.SphereGeometry(0.65, 32, 32);
        const innerMat = new THREE.MeshBasicMaterial({
            color: 0x0088ff,
            transparent: true,
            opacity: 0.45,
            blending: THREE.AdditiveBlending
        });
        const innerMesh = new THREE.Mesh(innerGeo, innerMat);
        coreGroup.add(innerMesh);

        const coreGeo = new THREE.IcosahedronGeometry(0.95, 2);
        const coreMat = new THREE.MeshBasicMaterial({
            color: 0x00ffcc,
            wireframe: true,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending
        });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        coreGroup.add(coreMesh);

        // B. 3D Segmented Stark-Tech Arcs (Broken Glowing Rings)
        const segmentedArcs = [];
        const arcConfigs = [
            { radius: 1.35, tube: 0.025, segments: 3, arcLen: 1.4, color: 0x00ffcc, speed: 0.015 },
            { radius: 1.65, tube: 0.018, segments: 4, arcLen: 0.9, color: 0x00f3ff, speed: -0.012 },
            { radius: 2.15, tube: 0.032, segments: 2, arcLen: 1.8, color: 0x0088ff, speed: 0.009 },
            { radius: 2.45, tube: 0.012, segments: 6, arcLen: 0.5, color: 0x00ffcc, speed: -0.018 }
        ];

        arcConfigs.forEach((cfg, idx) => {
            const arcGroup = new THREE.Group();
            for (let i = 0; i < cfg.segments; i++) {
                // Creates partial arc instead of boring full circle
                const geo = new THREE.TorusGeometry(cfg.radius, cfg.tube, 16, 60, cfg.arcLen);
                const mat = new THREE.MeshBasicMaterial({
                    color: cfg.color,
                    transparent: true,
                    opacity: 0.85,
                    blending: THREE.AdditiveBlending
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.rotation.z = (i * Math.PI * 2) / cfg.segments;
                arcGroup.add(mesh);
            }
            // Give each arc layer a unique 3D gyroscopic tilt
            arcGroup.rotation.x = (idx * 0.6) + 0.3;
            arcGroup.rotation.y = (idx * 0.5);
            arcGroup.userData = { speed: cfg.speed, idx: idx };
            coreGroup.add(arcGroup);
            segmentedArcs.push(arcGroup);
        });

        // C. 64 Radial Equalizer Spikes (Inspired by your 2D PERIGAL HUD!)
        const eqGroup = new THREE.Group();
        const eqBars = [];
        const barCount = 64;
        const eqRadius = 1.88;

        for (let i = 0; i < barCount; i++) {
            const angle = (i / barCount) * Math.PI * 2;
            const barGeo = new THREE.BoxGeometry(0.12, 0.025, 0.025);
            const barMat = new THREE.MeshBasicMaterial({
                color: i % 2 === 0 ? 0x00ffcc : 0x00aaff,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending
            });
            const bar = new THREE.Mesh(barGeo, barMat);
            bar.position.x = Math.cos(angle) * eqRadius;
            bar.position.y = Math.sin(angle) * eqRadius;
            bar.rotation.z = angle;
            eqGroup.add(bar);
            eqBars.push(bar);
        }
        coreGroup.add(eqGroup);

        // D. Outer Floating Hologram Dust
        const particlesGeo = new THREE.BufferGeometry();
        const particleCount = 300;
        const posArray = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 10;
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.035,
            color: 0x00ffcc,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });
        const particleMesh = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particleMesh);

        // E. Mouse / Touch 360 Drag Control
        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };
        window.addEventListener('pointerdown', (e) => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('pointerup', () => { isDragging = false; });
        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            coreGroup.rotation.y += (e.clientX - prevMouse.x) * 0.008;
            coreGroup.rotation.x += (e.clientY - prevMouse.y) * 0.008;
            prevMouse = { x: e.clientX, y: e.clientY };
        });

        let isSpeaking = false, isListening = false, isThinking = false, pulsePhase = 0;

        function animate() {
            requestAnimationFrame(animate);
            pulsePhase += 0.07;

            // Rotate inner core & particles
            coreMesh.rotation.y += 0.008;
            coreMesh.rotation.x -= 0.005;
            particleMesh.rotation.y += 0.0015;

            // 1. Animate Segmented 3D Arcs
            segmentedArcs.forEach((arcGroup) => {
                const boost = isThinking ? 3.5 : (isSpeaking ? 1.8 : 1);
                arcGroup.rotation.z += arcGroup.userData.speed * boost;
                arcGroup.rotation.x += (arcGroup.userData.speed * 0.35) * boost;
                arcGroup.rotation.y += (arcGroup.userData.speed * 0.25) * boost;
            });

            // 2. Animate 64 Equalizer Spikes (Audio-Reactive Wave)
            eqGroup.rotation.z -= 0.003;
            eqBars.forEach((bar, i) => {
                let wave = 1;
                if (isSpeaking) {
                    // Wild audio visualizer spikes when Repeater speaks!
                    wave = 1 + Math.abs(Math.sin(pulsePhase * 3 + i * 0.4)) * 3.8 + Math.random() * 1.5;
                } else if (isThinking) {
                    // Fast scanning wave when Gemini AI is thinking
                    wave = 1 + Math.abs(Math.sin(pulsePhase * 6 - i * 0.2)) * 2.5;
                } else if (isListening) {
                    // Gentle breathing wave when listening
                    wave = 1 + Math.abs(Math.sin(pulsePhase * 1.5 + i * 0.3)) * 1.2;
                }
                bar.scale.x = THREE.MathUtils.lerp(bar.scale.x, wave, 0.2);
            });

            // 3. State Color & Core Pulse
            let targetScale = 1;
            let themeColor = 0x007799;

            if (isSpeaking) {
                targetScale = 1.25 + Math.sin(pulsePhase * 4) * 0.22;
                themeColor = 0x00ffcc; // Neon Cyan-Green
            } else if (isThinking) {
                targetScale = 0.9 + Math.sin(pulsePhase * 7) * 0.12;
                themeColor = 0xffaa00; // Gold/Orange when AI thinks
            } else if (isListening) {
                targetScale = 1.06 + Math.sin(pulsePhase * 2) * 0.07;
                themeColor = 0x00ff66; // Emerald Green when Mic is ready
            }

            coreMat.color.setHex(themeColor);
            coreMesh.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.15);
            innerMesh.scale.lerp(new THREE.Vector3(targetScale * 0.9, targetScale * 0.9, targetScale * 0.9), 0.15);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        // ==========================================
        // 2. GEMINI AI BRAIN + VOICE ENGINE
        // ==========================================
        const statusEl = document.getElementById('status');
        const transcriptEl = document.getElementById('transcript-box');
        const toggleBtn = document.getElementById('toggle-btn');
        const apiBtn = document.getElementById('api-btn');
        const centerLogo = document.getElementById('center-logo');

        let geminiApiKey = localStorage.getItem('REPEATER_GEMINI_KEY') || '';
        updateApiBtnText();

        apiBtn.addEventListener('click', () => {
            const key = prompt("Paste your Google Gemini API Key (It stays saved privately in your browser):", geminiApiKey);
            if (key !== null) {
                geminiApiKey = key.trim();
                localStorage.setItem('REPEATER_GEMINI_KEY', geminiApiKey);
                updateApiBtnText();
            }
        });

        function updateApiBtnText() {
            apiBtn.innerText = geminiApiKey ? "✅ AI BRAIN ACTIVE" : "🔑 SET AI KEY";
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const synth = window.speechSynthesis;
        let recognition = null;
        let systemActive = false;

        if (!SpeechRecognition) {
            statusEl.innerText = "USE CHROME OR EDGE FOR VOICE RECOGNITION";
            toggleBtn.disabled = true;
        } else {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isListening = true;
                statusEl.innerText = "LISTENING...";
            };

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                transcriptEl.innerText = `You: "${transcript}"`;

                if (event.results[0].isFinal) {
                    processBrain(transcript.trim());
                }
            };

            recognition.onend = () => {
                isListening = false;
                if (systemActive && !isSpeaking && !isThinking) {
                    try { recognition.start(); } catch (e) {}
                } else if (!systemActive) {
                    statusEl.innerText = "SYSTEM STANDBY";
                }
            };
        }

        async function processBrain(text) {
            if (!text) return;
            const lower = text.toLowerCase();

            // 1. Instant System Commands
            if (lower.includes("current time") || lower === "what is the time") {
                centerLogo.innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                setTimeout(() => { centerLogo.innerText = "REPEATER"; }, 5000);
                return speakOut("Current time is " + new Date().toLocaleTimeString());
            }
            if (lower.startsWith("open youtube")) {
                window.open("https://www.youtube.com", "_blank");
                return speakOut("Opening YouTube, sir.");
            }
            if (lower.startsWith("open google")) {
                window.open("https://www.google.com", "_blank");
                return speakOut("Opening Google.");
            }
            if (lower.startsWith("repeat after me ")) {
                const toRepeat = text.replace(/repeat after me /i, "");
                return speakOut(toRepeat);
            }

            // 2. Real Gemini AI Brain (if API Key is set)
            if (geminiApiKey) {
                isThinking = true;
                statusEl.innerText = "THINKING (GEMINI AI)...";
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiApiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: `You are REPEATER, a futuristic 3D AI voice assistant inspired by JARVIS. Reply in 1 or 2 short, crisp, spoken sentences without markdown or asterisks. User said: "${text}"`
                                }]
                            }]
                        })
                    });
                    const data = await response.json();
                    isThinking = false;

                    if (data.candidates && data.candidates[0].content.parts[0].text) {
                        const aiReply = data.candidates[0].content.parts[0].text.replace(/[*#]/g, '');
                        return speakOut(aiReply);
                    } else {
                        return speakOut("My AI neural network returned an empty response. Please check your API key.");
                    }
                } catch (err) {
                    isThinking = false;
                    return speakOut("Error connecting to Gemini AI server.");
                }
            }

            // 3. Fallback: Repeater Mode (if no API key is entered yet)
            speakOut(text);
        }

      function speakOut(text) {
            synth.cancel();
            isSpeaking = true;
            statusEl.innerText = "REPEATER SPEAKING...";
            transcriptEl.innerText = `REPEATER: "${text}"`;

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.pitch = 0.9;
            utterance.rate = 1.05;

            // Backup Timer: Agar browser onend bhool jaye, toh bhi mic chalu ho jayega!
            const backupTimer = setTimeout(() => {
                if (isSpeaking) {
                    isSpeaking = false;
                    if (systemActive) {
                        statusEl.innerText = "🟢 LISTENING... SPEAK NOW!";
                        try { recognition.start(); } catch (e) {}
                    }
                }
            }, Math.max(3000, text.length * 85));

            utterance.onend = () => {
                clearTimeout(backupTimer);
                isSpeaking = false;
                if (systemActive) {
                    statusEl.innerText = "🟢 LISTENING... SPEAK NOW!";
                    try { recognition.start(); } catch (e) {}
                } else {
                    statusEl.innerText = "SYSTEM STANDBY";
                }
            };

            synth.speak(utterance);
        } 

        toggleBtn.addEventListener('click', () => {
            if (!recognition) return;
            systemActive = !systemActive;
            if (systemActive) {
                toggleBtn.innerText = "DEACTIVATE SYSTEM";
                speakOut("Allow me to introduce myself. I am Repeater, a virtual artificial intelligence, and my systems are now fully operational.");
            } else {
                toggleBtn.innerText = "ACTIVATE SYSTEM";
                synth.cancel();
                recognition.stop();
                isSpeaking = false;
                isListening = false;
                isThinking = false;
                statusEl.innerText = "SYSTEM STANDBY";
            }
        });
    </script>
</body>
</html>
