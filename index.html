<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REPEATER 3D - AI Assistant</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #01090d;
            color: #00f3ff;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            cursor: grab;
        }
        #canvas-container:active {
            cursor: grabbing;
        }
        /* Center Holographic REPEATER Animation (Like the Video) */
        #center-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 7px;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc, 0 0 25px #00f3ff, 0 0 40px #0088ff;
            z-index: 2;
            pointer-events: none;
            animation: holoPulse 2.2s ease-in-out infinite alternate;
        }
        @keyframes holoPulse {
            0% { opacity: 0.45; transform: translate(-50%, -50%) scale(0.92); letter-spacing: 6px; }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); letter-spacing: 9px; }
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 3;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 25px;
            box-sizing: border-box;
            background: radial-gradient(circle, transparent 40%, rgba(0, 12, 18, 0.88) 100%);
        }
        header {
            text-align: center;
            text-shadow: 0 0 12px #00f3ff;
            width: 100%;
            position: relative;
        }
        h1 {
            margin: 0;
            letter-spacing: 8px;
            font-size: 26px;
            color: #00ffcc;
        }
        #status {
            font-size: 13px;
            color: #00f3ff;
            margin-top: 6px;
            letter-spacing: 2px;
        }
        #api-btn {
            position: absolute;
            top: 0;
            right: 10px;
            pointer-events: auto;
            font-size: 12px;
            padding: 8px 14px;
            letter-spacing: 1px;
        }
        #transcript-box {
            max-width: 680px;
            text-align: center;
            font-size: 17px;
            min-height: 45px;
            margin-top: auto;
            margin-bottom: 25px;
            padding: 15px 25px;
            border: 1px solid rgba(0, 255, 204, 0.4);
            background: rgba(0, 22, 32, 0.65);
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            text-shadow: 0 0 5px #00f3ff;
        }
        #controls {
            pointer-events: auto;
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }
        button {
            background: rgba(0, 243, 255, 0.12);
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 12px 28px;
            font-family: inherit;
            font-size: 15px;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.35);
            transition: all 0.25s ease;
            text-transform: uppercase;
        }
        button:hover {
            background: #00ffcc;
            color: #01090d;
            box-shadow: 0 0 25px #00ffcc;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Center Animation Text inside the 3D Orb -->
    <div id="center-logo">REPEATER</div>

    <div id="hud">
        <header>
            <h1>R.E.P.E.A.T.E.R.</h1>
            <div id="status">SYSTEM STANDBY</div>
            <button id="api-btn">🔑 SET AI KEY</button>
        </header>

        <div id="transcript-box">Click ACTIVATE SYSTEM to boot Repeater AI...</div>

        <div id="controls">
            <button id="toggle-btn">ACTIVATE SYSTEM</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 3D HOLOGRAM CORE (THREE.JS)
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5.5;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const coreGroup = new THREE.Group();
        scene.add(coreGroup);

        // Inner Wireframe Sphere
        const coreGeo = new THREE.IcosahedronGeometry(1.05, 2);
        const coreMat = new THREE.MeshBasicMaterial({
            color: 0x00ffcc,
            wireframe: true,
            transparent: true,
            opacity: 0.65
        });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        coreGroup.add(coreMesh);

        // Deep Glowing Core
        const innerGeo = new THREE.SphereGeometry(0.68, 32, 32);
        const innerMat = new THREE.MeshBasicMaterial({
            color: 0x0088ff,
            transparent: true,
            opacity: 0.35
        });
        const innerMesh = new THREE.Mesh(innerGeo, innerMat);
        coreGroup.add(innerMesh);

        // Gyroscopic Rings
        const rings = [];
        for (let i = 0; i < 4; i++) {
            const ringGeo = new THREE.TorusGeometry(1.55 + i * 0.32, 0.016, 16, 100);
            const ringMat = new THREE.MeshBasicMaterial({
                color: i % 2 === 0 ? 0x00ffcc : 0x00f3ff,
                transparent: true,
                opacity: 0.6 - (i * 0.1)
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.random() * Math.PI;
            ring.rotation.y = Math.random() * Math.PI;
            coreGroup.add(ring);
            rings.push(ring);
        }

        // Particle Field
        const particlesGeo = new THREE.BufferGeometry();
        const particleCount = 250;
        const posArray = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 9;
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.03,
            color: 0x00ffcc,
            transparent: true,
            opacity: 0.5
        });
        const particleMesh = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particleMesh);

        // Mouse Drag Rotation
        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };
        window.addEventListener('pointerdown', (e) => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('pointerup', () => { isDragging = false; });
        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            coreGroup.rotation.y += (e.clientX - prevMouse.x) * 0.008;
            coreGroup.rotation.x += (e.clientY - prevMouse.y) * 0.008;
            prevMouse = { x: e.clientX, y: e.clientY };
        });

        let isSpeaking = false;
        let isListening = false;
        let isThinking = false;
        let pulsePhase = 0;

        function animate() {
            requestAnimationFrame(animate);
            pulsePhase += 0.06;

            coreMesh.rotation.y += 0.006;
            coreMesh.rotation.x += 0.004;
            particleMesh.rotation.y += 0.0015;

            rings.forEach((ring, idx) => {
                const dir = idx % 2 === 0 ? 1 : -1;
                const speed = isThinking ? 0.03 : 0.008;
                ring.rotation.x += speed * dir;
                ring.rotation.y += (speed * 1.2) * dir;
            });

            let targetScale = 1;
            if (isSpeaking) {
                targetScale = 1.22 + Math.sin(pulsePhase * 4) * 0.25 + (Math.random() * 0.1);
                coreMat.color.setHex(0x00ffcc);
            } else if (isThinking) {
                targetScale = 0.9 + Math.sin(pulsePhase * 6) * 0.1;
                coreMat.color.setHex(0xffaa00); // Glows orange/gold when AI is thinking
            } else if (isListening) {
                targetScale = 1.0 + Math.sin(pulsePhase * 1.5) * 0.07;
                coreMat.color.setHex(0x00f3ff);
            } else {
                targetScale = 1.0;
                coreMat.color.setHex(0x007799);
            }

            coreMesh.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.15);
            innerMesh.scale.lerp(new THREE.Vector3(targetScale * 0.9, targetScale * 0.9, targetScale * 0.9), 0.15);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==========================================
        // 2. GEMINI AI BRAIN + VOICE ENGINE
        // ==========================================
        const statusEl = document.getElementById('status');
        const transcriptEl = document.getElementById('transcript-box');
        const toggleBtn = document.getElementById('toggle-btn');
        const apiBtn = document.getElementById('api-btn');
        const centerLogo = document.getElementById('center-logo');

        let geminiApiKey = localStorage.getItem('REPEATER_GEMINI_KEY') || '';
        updateApiBtnText();

        apiBtn.addEventListener('click', () => {
            const key = prompt("Paste your Google Gemini API Key (It stays saved privately in your browser):", geminiApiKey);
            if (key !== null) {
                geminiApiKey = key.trim();
                localStorage.setItem('REPEATER_GEMINI_KEY', geminiApiKey);
                updateApiBtnText();
            }
        });

        function updateApiBtnText() {
            apiBtn.innerText = geminiApiKey ? "✅ AI BRAIN ACTIVE" : "🔑 SET AI KEY";
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const synth = window.speechSynthesis;
        let recognition = null;
        let systemActive = false;

        if (!SpeechRecognition) {
            statusEl.innerText = "USE CHROME OR EDGE FOR VOICE RECOGNITION";
            toggleBtn.disabled = true;
        } else {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isListening = true;
                statusEl.innerText = "LISTENING...";
            };

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                transcriptEl.innerText = `You: "${transcript}"`;

                if (event.results[0].isFinal) {
                    processBrain(transcript.trim());
                }
            };

            recognition.onend = () => {
                isListening = false;
                if (systemActive && !isSpeaking && !isThinking) {
                    try { recognition.start(); } catch (e) {}
                } else if (!systemActive) {
                    statusEl.innerText = "SYSTEM STANDBY";
                }
            };
        }

        async function processBrain(text) {
            if (!text) return;
            const lower = text.toLowerCase();

            // 1. Instant System Commands
            if (lower.includes("current time") || lower === "what is the time") {
                centerLogo.innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                setTimeout(() => { centerLogo.innerText = "REPEATER"; }, 5000);
                return speakOut("Current time is " + new Date().toLocaleTimeString());
            }
            if (lower.startsWith("open youtube")) {
                window.open("https://www.youtube.com", "_blank");
                return speakOut("Opening YouTube, sir.");
            }
            if (lower.startsWith("open google")) {
                window.open("https://www.google.com", "_blank");
                return speakOut("Opening Google.");
            }
            if (lower.startsWith("repeat after me ")) {
                const toRepeat = text.replace(/repeat after me /i, "");
                return speakOut(toRepeat);
            }

            // 2. Real Gemini AI Brain (if API Key is set)
            if (geminiApiKey) {
                isThinking = true;
                statusEl.innerText = "THINKING (GEMINI AI)...";
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiApiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: `You are REPEATER, a futuristic 3D AI voice assistant inspired by JARVIS. Reply in 1 or 2 short, crisp, spoken sentences without markdown or asterisks. User said: "${text}"`
                                }]
                            }]
                        })
                    });
                    const data = await response.json();
                    isThinking = false;

                    if (data.candidates && data.candidates[0].content.parts[0].text) {
                        const aiReply = data.candidates[0].content.parts[0].text.replace(/[*#]/g, '');
                        return speakOut(aiReply);
                    } else {
                        return speakOut("My AI neural network returned an empty response. Please check your API key.");
                    }
                } catch (err) {
                    isThinking = false;
                    return speakOut("Error connecting to Gemini AI server.");
                }
            }

            // 3. Fallback: Repeater Mode (if no API key is entered yet)
            speakOut(text);
        }

        function speakOut(text) {
            isSpeaking = true;
            statusEl.innerText = "REPEATER SPEAKING...";
            transcriptEl.innerText = `REPEATER: "${text}"`;

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.pitch = 0.9;
            utterance.rate = 1.05;

            utterance.onend = () => {
                isSpeaking = false;
                if (systemActive) {
                    statusEl.innerText = "LISTENING...";
                    try { recognition.start(); } catch (e) {}
                } else {
                    statusEl.innerText = "SYSTEM STANDBY";
                }
            };

            synth.speak(utterance);
        }

        toggleBtn.addEventListener('click', () => {
            if (!recognition) return;
            systemActive = !systemActive;
            if (systemActive) {
                toggleBtn.innerText = "DEACTIVATE SYSTEM";
                speakOut("Allow me to introduce myself. I am Repeater, a virtual artificial intelligence, and my systems are now fully operational.");
            } else {
                toggleBtn.innerText = "ACTIVATE SYSTEM";
                synth.cancel();
                recognition.stop();
                isSpeaking = false;
                isListening = false;
                isThinking = false;
                statusEl.innerText = "SYSTEM STANDBY";
            }
        });
    </script>
</body>
</html>
